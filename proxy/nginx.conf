pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Temp paths for unprivileged non-root execution
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Security settings
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Rate limiting zone (optional DDoS protection on local LAN)
    limit_req_zone $binary_remote_addr zone=weather_limit:10m rate=10r/s;

    server {
        listen 8080;
        server_name _;

        # Health check endpoint
        location /health {
            default_type text/plain;
            return 200 "OK\n";
        }

        # Proxy to Bright Sky DWD API
        location / {
            # Only allow safe read methods
            limit_except GET HEAD {
                deny all;
            }

            limit_req zone=weather_limit burst=20 nodelay;

            proxy_pass https://api.brightsky.dev;
            proxy_set_header Host api.brightsky.dev;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }
    }
}
